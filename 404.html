<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error — Page Not Found</title>
<!-- Favicon -->
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1KlSuCf2eyxJCY2Yij0zqYIk-uW6El8JZ">
<style>
  :root{
    --ink:#0b1220;
    --panel:#0f1b2e;
    --panel-2:#13233c;
    --line:rgba(148,178,214,0.18);
    --text:#e7edf6;
    --muted:#93a3ba;
    --gold:#d8a942;
    --blue:#3d7cf2;
    --red:#e0524a;
    --green:#3fa96a;
    --purple:#9b6bd6;
    --glass-bg:rgba(15,27,46,0.55);
    --glass-border:rgba(216,169,66,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(61,124,242,0.10), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(216,169,66,0.08), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family: "Iowan Old Style","Georgia","Times New Roman",serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .data-font{ font-family:"SF Mono","JetBrains Mono","Consolas",monospace; font-variant-numeric: tabular-nums; }

  .wrap{width:100%;max-width:640px;}

  .eyebrow{
    font-family:"SF Mono","JetBrains Mono",monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold);
    margin:0 0 6px;
    text-align:center;
  }
  h1{
    margin:0 0 4px;
    font-size:42px;
    font-weight:600;
    letter-spacing:-0.01em;
    text-align:center;
  }
  .sub{color:var(--muted); font-size:14px; margin:0 0 18px; text-align:center;}

  /* ---- Glassmorphic panel ---- */
  .panel{
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    background: var(--glass-bg);
    border:1px solid var(--glass-border);
    border-radius:14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    overflow:hidden;
  }

  /* ---- Table styled like the results grid ---- */
  .table-shell{
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel);
    margin:0 20px 20px;
  }
  .col-headers{
    display:grid;
    grid-template-columns: 1fr 2fr;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
  }
  .col-headers > div{
    padding:10px 12px;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    font-family:"SF Mono","JetBrains Mono",monospace;
    border-right:1px solid var(--line);
  }
  .col-headers > div:last-child{border-right:none;}

  .row{
    display:grid;
    grid-template-columns: 1fr 2fr;
    border-bottom:1px solid rgba(148,178,214,0.08);
    font-size:13px;
    align-items:center;
  }
  .row:last-child{border-bottom:none;}
  .row:nth-child(odd){ background:rgba(255,255,255,0.015); }
  .row > div{
    padding:10px 12px;
    border-right:1px solid rgba(148,178,214,0.06);
  }
  .row > div:last-child{border-right:none;}
  .cell-key{color:var(--muted); font-family:"SF Mono","JetBrains Mono",monospace; font-size:11.5px; letter-spacing:.02em;}
  .cell-val{color:var(--text); font-weight:600;}

  .status-badge{
    display:inline-block;
    font-family:"SF Mono","JetBrains Mono",monospace;
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:4px;
    letter-spacing:.03em;
  }
  .status-badge.cls-4xx{ background:rgba(224,82,74,0.18); color:#f08c85; }
  .status-badge.cls-5xx{ background:rgba(155,107,214,0.18); color:#c3a3ec; }

  .top-pad{padding:26px 20px 4px;}

  .actions{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
    padding:0 20px 24px;
  }
  a.btn{
    background:rgba(216,169,66,0.14);
    border:1px solid var(--glass-border);
    color:var(--gold);
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    text-decoration:none;
    display:inline-block;
  }
  a.btn:hover{background:rgba(216,169,66,0.22);}

  .footnote{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    font-family:"SF Mono","JetBrains Mono",monospace;
    margin-top:16px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow" id="eyebrow">Error · Lookup Failed</p>
    <h1 id="codeTitle">404</h1>
    <p class="sub" id="subText">The page you requested could not be found.</p>

    <div class="panel">
      <div class="table-shell top-pad">
        <div class="col-headers">
          <div>Field</div>
          <div>Value</div>
        </div>
        <div class="row">
          <div class="cell-key">STATUS</div>
          <div class="cell-val"><span class="status-badge" id="statusBadge">404 NOT FOUND</span></div>
        </div>
        <div class="row">
          <div class="cell-key">REQUESTED PATH</div>
          <div class="cell-val data-font" id="reqPath">—</div>
        </div>
        <div class="row">
          <div class="cell-key">REASON</div>
          <div class="cell-val" id="reasonText">No matching record in the routing table</div>
        </div>
        <div class="row">
          <div class="cell-key">SUGGESTION</div>
          <div class="cell-val" id="suggestionText">Check the URL, or head back to the homepage</div>
        </div>
      </div>

      <div class="actions">
        <a class="btn" href="https://demdata.robo-universe.com">Return Home</a>
      </div>
    </div>

    <p class="footnote" id="footnote">ERR_CODE · 0x194 · NOT_FOUND</p>
  </div>

  <script>
    // ---- Set the active error code here ----
    const ACTIVE_ERROR = 404;

    const errors = {
      // 4xx — Client errors
      400: { title:"Bad Request", group:"4xx", sub:"The request could not be understood by the server.",
             reason:"The request contains invalid syntax and could not be processed.",
             suggestion:"Check the request parameters and try again." },
      401: { title:"Unauthorized", group:"4xx", sub:"Authentication is required to access this resource.",
             reason:"No valid credentials were provided with the request.",
             suggestion:"Sign in and try again." },
      402: { title:"Payment Required", group:"4xx", sub:"Access to this resource requires payment.",
             reason:"Reserved for future use; typically signals a payment or subscription is needed.",
             suggestion:"Check your account's billing status." },
      403: { title:"Forbidden", group:"4xx", sub:"You do not have permission to access this resource.",
             reason:"The server understood the request but refuses to authorize it.",
             suggestion:"Contact an administrator if you believe this is a mistake." },
      404: { title:"Not Found", group:"4xx", sub:"The page you requested could not be found.",
             reason:"No matching record exists in the routing table.",
             suggestion:"Check the URL, or head back to the homepage." },
      405: { title:"Method Not Allowed", group:"4xx", sub:"This request method isn't supported here.",
             reason:"The HTTP method used is not supported for the target resource.",
             suggestion:"Retry using a supported method." },
      406: { title:"Not Acceptable", group:"4xx", sub:"The server can't return content matching what you asked for.",
             reason:"No response format matches the client's Accept headers.",
             suggestion:"Adjust the requested content type and try again." },
      407: { title:"Proxy Authentication Required", group:"4xx", sub:"Authentication with the proxy is required.",
             reason:"The client must first authenticate itself with the proxy server.",
             suggestion:"Provide valid proxy credentials and retry." },
      408: { title:"Request Timeout", group:"4xx", sub:"The server timed out waiting for the request.",
             reason:"The client did not produce a request within the time the server was prepared to wait.",
             suggestion:"Refresh the page and try again." },
      409: { title:"Conflict", group:"4xx", sub:"The request conflicts with the current state of the resource.",
             reason:"The request could not be completed due to a conflict.",
             suggestion:"Reload the latest version of the resource and retry." },
      410: { title:"Gone", group:"4xx", sub:"This resource is no longer available.",
             reason:"The resource has been permanently removed and will not return.",
             suggestion:"Remove any bookmarks or links pointing here." },
      411: { title:"Length Required", group:"4xx", sub:"A Content-Length header is required.",
             reason:"The server refuses to accept the request without a defined content length.",
             suggestion:"Include a valid Content-Length header and retry." },
      412: { title:"Precondition Failed", group:"4xx", sub:"A precondition in the request was not met.",
             reason:"One or more conditions in the request headers evaluated to false.",
             suggestion:"Refresh your data and retry the request." },
      413: { title:"Payload Too Large", group:"4xx", sub:"The request body is larger than the server allows.",
             reason:"The request entity exceeds the size limits defined by the server.",
             suggestion:"Reduce the payload size and try again." },
      414: { title:"URI Too Long", group:"4xx", sub:"The requested URL is too long for the server to process.",
             reason:"The URI exceeds the maximum length the server is willing to interpret.",
             suggestion:"Shorten the URL, for example by using fewer query parameters." },
      415: { title:"Unsupported Media Type", group:"4xx", sub:"The format of the submitted data isn't supported.",
             reason:"The media type of the request payload is not supported by the server.",
             suggestion:"Submit the data in a supported format." },
      416: { title:"Range Not Satisfiable", group:"4xx", sub:"The requested byte range can't be provided.",
             reason:"The range specified in the Range header cannot be fulfilled.",
             suggestion:"Remove or correct the Range header and retry." },
      417: { title:"Expectation Failed", group:"4xx", sub:"The server can't meet the request's requirements.",
             reason:"The expectation given in the request's Expect header could not be met.",
             suggestion:"Remove the Expect header and try again." },
      418: { title:"I'm a Teapot", group:"4xx", sub:"The server refuses to brew coffee because it is a teapot.",
             reason:"Defined in RFC 2324 as an April Fools' joke; used today as a novelty status.",
             suggestion:"Try requesting tea instead." },
      421: { title:"Misdirected Request", group:"4xx", sub:"This server can't produce a response for the request.",
             reason:"The request was directed at a server that is not configured to respond to it.",
             suggestion:"Retry the request against the correct origin server." },
      422: { title:"Unprocessable Entity", group:"4xx", sub:"The request was well-formed but semantically invalid.",
             reason:"The server understands the content type but couldn't process the contained instructions.",
             suggestion:"Review the submitted data for errors and resubmit." },
      423: { title:"Locked", group:"4xx", sub:"The resource you're trying to access is locked.",
             reason:"The target resource is currently locked and unavailable for the requested action.",
             suggestion:"Wait for the lock to clear, or contact an administrator." },
      424: { title:"Failed Dependency", group:"4xx", sub:"This request depended on another request that failed.",
             reason:"The request failed because a prior, related request failed.",
             suggestion:"Resolve the underlying failure and retry." },
      425: { title:"Too Early", group:"4xx", sub:"The server won't risk processing a request that might be replayed.",
             reason:"The request was sent before the server was ready to accept it.",
             suggestion:"Retry the request after the connection is fully established." },
      426: { title:"Upgrade Required", group:"4xx", sub:"The client should switch to a different protocol.",
             reason:"The server refuses to process the request using the current protocol.",
             suggestion:"Retry the request using the protocol specified in the Upgrade header." },
      428: { title:"Precondition Required", group:"4xx", sub:"The origin server requires a conditional request.",
             reason:"The server requires the request to include preconditions to avoid conflicts.",
             suggestion:"Add the required conditional headers and retry." },
      429: { title:"Too Many Requests", group:"4xx", sub:"You've sent too many requests recently.",
             reason:"The client has exceeded the rate limit set by the server.",
             suggestion:"Wait a moment before trying again." },
      431: { title:"Request Header Fields Too Large", group:"4xx", sub:"The request's headers are too large to process.",
             reason:"One or more header fields, or the headers collectively, exceed server limits.",
             suggestion:"Reduce the size of your request headers and retry." },
      451: { title:"Unavailable For Legal Reasons", group:"4xx", sub:"This resource is unavailable due to legal demands.",
             reason:"Access has been restricted in response to a legal request.",
             suggestion:"Contact the site operator for more information." },

      // 5xx — Server errors
      500: { title:"Internal Server Error", group:"5xx", sub:"Something went wrong on our end.",
             reason:"The server encountered an unexpected condition it doesn't know how to handle.",
             suggestion:"Try again shortly; contact support if it persists." },
      501: { title:"Not Implemented", group:"5xx", sub:"The server doesn't support the functionality required.",
             reason:"The server does not recognize the request method or lacks the ability to fulfill it.",
             suggestion:"Check back later as this feature may not yet be available." },
      502: { title:"Bad Gateway", group:"5xx", sub:"An upstream server sent an invalid response.",
             reason:"The server, acting as a gateway, received an invalid response from an upstream server.",
             suggestion:"Refresh the page in a few moments." },
      503: { title:"Service Unavailable", group:"5xx", sub:"The service is temporarily unavailable.",
             reason:"The server is currently unable to handle the request, often due to maintenance or overload.",
             suggestion:"Please try again in a few minutes." },
      504: { title:"Gateway Timeout", group:"5xx", sub:"An upstream server took too long to respond.",
             reason:"The server, acting as a gateway, did not receive a timely response from an upstream server.",
             suggestion:"Retry the request; the upstream service may be slow." },
      505: { title:"HTTP Version Not Supported", group:"5xx", sub:"The HTTP version used isn't supported.",
             reason:"The server does not support the HTTP protocol version used in the request.",
             suggestion:"Retry using a supported HTTP version." },
      506: { title:"Variant Also Negotiates", group:"5xx", sub:"A server configuration error caused a negotiation loop.",
             reason:"The chosen content negotiation variant results in a circular reference.",
             suggestion:"This is a server misconfiguration; contact the site operator." },
      507: { title:"Insufficient Storage", group:"5xx", sub:"The server can't store what's needed to complete this request.",
             reason:"The server is unable to store the representation needed to complete the request.",
             suggestion:"Try again later once server storage has been freed." },
      508: { title:"Loop Detected", group:"5xx", sub:"The server detected an infinite loop while processing the request.",
             reason:"The server terminated the request after detecting an infinite loop.",
             suggestion:"Contact the site operator; this indicates a server-side configuration issue." },
      510: { title:"Not Extended", group:"5xx", sub:"Further extensions to the request are required.",
             reason:"The server requires further extensions to fulfill the request.",
             suggestion:"Check the server's documentation for required extensions." },
      511: { title:"Network Authentication Required", group:"5xx", sub:"You need to authenticate to gain network access.",
             reason:"The client needs to authenticate to gain network access, often behind a captive portal.",
             suggestion:"Sign in to the network and retry." }
    };

    function renderError(code){
      const e = errors[code];
      if(!e) return;
      document.getElementById('eyebrow').textContent =
        (e.group === "4xx" ? "Error · Client Error" : "Error · Server Error");
      document.getElementById('codeTitle').textContent = code;
      document.getElementById('subText').textContent = e.sub;
      const badge = document.getElementById('statusBadge');
      badge.textContent = `${code} ${e.title.toUpperCase()}`;
      badge.className = 'status-badge ' + (e.group === "4xx" ? 'cls-4xx' : 'cls-5xx');
      document.getElementById('reasonText').textContent = e.reason;
      document.getElementById('suggestionText').textContent = e.suggestion;
      const slug = e.title.toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
      document.getElementById('footnote').textContent =
        `ERR_CODE · 0x${Number(code).toString(16).toUpperCase()} · ${slug}`;
      document.title = `${code} — ${e.title}`;
    }

    document.getElementById('reqPath').textContent = window.location.pathname || '/';
    renderError(ACTIVE_ERROR);
  </script>
</body>
</html>
